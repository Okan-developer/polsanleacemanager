# scripts/check.conf — PolsanLeaveManager (.NET 10 modular monolith). Generated at bootstrap.
# One step per line:  <name>: <command>  — runs in order, fails fast (see scripts/check).
# Every dotnet call goes through scripts/dotnet-step: it applies the resource-hygiene switches
# (no MSBuild nodes, no MSBuild server, no VBCSCompiler, no Razor build server) and the greenfield
# guard (no-op until the first .NET project exists). Expects one solution file at the repo root.
#
# Two speeds (docs/testing.md): [fast] = restore, compile, format, Unit + Architecture tests.
# Full only = Integration (Testcontainers/PostgreSQL, needs Docker running) + E2E (Playwright) +
# vulnerable-package scan. The test split is by selector — xUnit [Trait("Category", ...)] — and
# the full-only step runs the inverted filter, so an untagged test still runs (in full).
#
# resource hygiene: test hosts exit when dotnet test ends; Testcontainers fixtures dispose their
#   containers (Ryuk reaps them if a run crashes); the E2E fixture owns the app under test
#   (in-process Kestrel, random port) and the browser — headless, single worker, disposed on
#   failure and timeout too. No dev server, no watch mode, no `dotnet run` in check.

restore [fast]: sh scripts/dotnet-step restore
build [fast]: sh scripts/dotnet-step build --no-restore -c Release -nodeReuse:false
format [fast]: sh scripts/dotnet-step format --verify-no-changes --no-restore
test unit+architecture [fast]: sh scripts/dotnet-step test --no-build -c Release -nodeReuse:false --filter "Category=Unit|Category=Architecture"
test integration+e2e: sh scripts/dotnet-step test --no-build -c Release -nodeReuse:false --filter "Category!=Unit&Category!=Architecture"
vulnerable packages: out=$(sh scripts/dotnet-step list package --vulnerable --include-transitive) || exit 1; echo "$out"; ! printf '%s\n' "$out" | grep -Eq '[[:space:]](High|Critical)([[:space:]]|$)'
